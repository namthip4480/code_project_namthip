<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARP - เข้าสู่ระบบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --accent-blue: #2563eb;
            --accent-rose: #e11d48;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            text-align: center;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: #dbeafe;
            color: var(--accent-blue);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .brand-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-header span {
            font-size: 0.75rem;
            background: #dbeafe;
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .brand-header p { font-size: 0.88rem; color: var(--text-muted); }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.92rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            background: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-login:hover { background: #1d4ed8; }

        .error-badge {
            background: #ffe4e6;
            color: var(--accent-rose);
            border: 1px solid #fecdd3;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 18px;
            display: none;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <h1>WARP Controller <span>ESP32 Ready</span></h1>
            <p>เข้าสู่ระบบเพื่อใช้งานระบบควบคุมไทม์ไลน์</p>
        </div>

        <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้งาน (Username)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้ (admin)" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน (Password)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน (1234)" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
            </button>
        </form>

        <div id="error-badge" class="error-badge">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
        </div>
    </div>

    <script>
        async function doLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const errorBadge = document.getElementById('error-badge');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('currentUser', data.username);
                    window.location.href = '/index.html';
                } else {
                    errorBadge.style.display = 'flex';
                }
            } catch (err) {
                console.error("Login failed:", err);
                errorBadge.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
