<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WARP Interactive Player - ระบบเล่นบทเรียนโต้ตอบ (ESP32)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        (function() {
            const role = localStorage.getItem('warp_user_role');
            if (!role) window.location.href = 'login.html';
        })();
    </script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-purple: #6366f1;
            --accent-rose: #f43f5e;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }

        /* ล็อคความสูงหน้าจอพอดีเป๊ะ ห้ามมี Scrollbar */
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 1.25rem;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow-sm); height: 56px; flex-shrink: 0;
        }

        .logo-group { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--text-primary); font-weight: 700; font-size: 1.1rem; }
        .logo-icon { font-size: 1.3rem; color: var(--accent-purple); }

        .nav-actions { display: flex; gap: 0.5rem; align-items: center; }
        .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.8rem; border-radius: 0.5rem; font-weight: 500; font-size: 0.82rem; cursor: pointer; text-decoration: none; border: 1px solid transparent; white-space: nowrap; }
        .btn-outline { border-color: var(--border-color); color: var(--text-secondary); background: var(--bg-card); }
        .btn-rose { background: var(--accent-rose); color: white; }

        .select-input { padding: 0.4rem 0.75rem; border: 1px solid var(--border-color); border-radius: 0.5rem; font-size: 0.82rem; outline: none; background: var(--bg-card); font-weight: 500; }

        /* คอนเทนเนอร์หลัก ยืดขยายพอดีพื้นที่จอที่เหลือ */
        .player-container {
            flex: 1; display: flex; flex-direction: column;
            padding: 0.75rem; gap: 0.5rem; height: calc(100vh - 56px);
            max-width: 1400px; width: 100%; margin: 0 auto;
        }

        .status-bar {
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 0.4rem 1rem; border-radius: 8px; display: flex;
            justify-content: space-between; align-items: center; font-size: 0.82rem;
            box-shadow: var(--shadow-sm); flex-shrink: 0;
        }

        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }

        /* กล่องเล่นวิดีโอ ยืดขยายอัตโนมัติ */
        .video-card {
            flex: 1; background: #000000; border-radius: 10px;
            overflow: hidden; position: relative; display: flex;
            align-items: center; justify-content: center; width: 100%; min-height: 0;
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        /* ป๊อปอัพโจทย์คำถาม แบบ Light Mode ปรับขนาดอัตโนมัติ */
        .question-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.97); backdrop-filter: blur(8px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 1.5rem; z-index: 50; color: var(--text-primary); text-align: center;
        }

        .hardware-badge {
            background: #eef2ff; border: 1px solid var(--accent-purple); color: var(--accent-purple);
            padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            margin-bottom: 0.75rem; display: inline-flex; align-items: center; gap: 6px;
        }

        .question-title {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem); font-weight: 700;
            margin-bottom: 1rem; color: var(--text-primary); max-width: 90%; line-height: 1.3;
        }

        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
            width: 100%; max-width: 800px;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; gap: 0.5rem; }
        }

        .option-card {
            background: #ffffff; border: 2px solid var(--border-color);
            border-radius: 8px; padding: 0.75rem 1rem; display: flex;
            align-items: center; gap: 0.75rem; font-size: clamp(0.85rem, 1.8vw, 1.05rem);
            font-weight: 600; text-align: left; box-shadow: var(--shadow-sm);
        }

        .option-card.red { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
        .option-card.yellow { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
        .option-card.green { border-color: #10b981; background: #ecfdf5; color: #065f46; }
        .option-card.blue { border-color: #3b82f6; background: #eff6ff; color: #1e40af; }

        .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

        .feedback-banner {
            margin-top: 1rem; font-size: 1rem; font-weight: 700; padding: 0.5rem 1.25rem;
            border-radius: 8px; display: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="player.html" class="logo-group">
            <i class="fa-solid fa-circle-play logo-icon"></i>
            <span>WARP Interactive Player</span>
        </a>

        <div class="nav-actions">
            <select id="player-lesson-select" class="select-input" onchange="loadLessonForPlayer(this.value)">
                <option value="">-- เลือกบทเรียน --</option>
            </select>

            <a href="index.html" class="btn btn-outline" id="admin-studio-btn">
                <i class="fa-solid fa-sliders" style="color:var(--accent-purple);"></i> หน้า Studio
            </a>

            <button class="btn btn-rose" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
            </button>
        </div>
    </header>

    <div class="player-container">
        <div class="status-bar">
            <div><strong>ผู้เรียน:</strong> <span id="student-name-display">กำลังโหลด...</span></div>
            <div>
                <strong>สถานะ ESP32:</strong>
                <span class="badge badge-success" id="espStatusTag"><i class="fa-solid fa-wifi"></i> พร้อมใช้งาน</span>
            </div>
        </div>

        <div class="video-card">
            <video id="playerVideo" controls playsinline preload="auto">
                <source src="" type="video/mp4">
            </video>

            <div class="question-overlay" id="questionOverlay">
                <div class="hardware-badge">
                    <i class="fa-solid fa-gamepad"></i> กดปุ่มสีที่กล่องฮาร์ดแวร์ Arcade (ESP32) เพื่อตอบ
                </div>

                <h2 class="question-title" id="displayQuestion">โจทย์คำถาม...</h2>

                <div class="options-grid">
                    <div class="option-card red">
                        <span class="color-dot" style="background:#ef4444;"></span>
                        <span id="txtRed">ข้อ ก.</span>
                    </div>
                    <div class="option-card yellow">
                        <span class="color-dot" style="background:#f59e0b;"></span>
                        <span id="txtYellow">ข้อ ข.</span>
                    </div>
                    <div class="option-card green">
                        <span class="color-dot" style="background:#10b981;"></span>
                        <span id="txtGreen">ข้อ ค.</span>
                    </div>
                    <div class="option-card blue">
                        <span class="color-dot" style="background:#3b82f6;"></span>
                        <span id="txtBlue">ข้อ ง.</span>
                    </div>
                </div>

                <div class="feedback-banner" id="feedbackBanner"></div>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = 'WARP_Video_Library';
        const STORE_NAME = 'videos';
        const API_BASE_URL = window.location.origin;

        let lessonData = null;
        let currentEvent = null;
        let triggeredEvents = new Set();
        let espPollingInterval = null;

        const playerVideo = document.getElementById('playerVideo');
        const questionOverlay = document.getElementById('questionOverlay');
        const feedbackBanner = document.getElementById('feedbackBanner');

        function handleLogout() { localStorage.clear(); window.location.href = 'login.html'; }

        function openVideoDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = () => resolve(null);
            });
        }

        async function getVideoFromStorage(lessonKey) {
            try {
                const db = await openVideoDB();
                if (!db) return null;
                return new Promise((resolve) => {
                    const req = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).get(lessonKey);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch (e) { return null; }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('warp_user_name') || 'นักเรียน';
            const userRole = localStorage.getItem('warp_user_role');
            document.getElementById('student-name-display').innerText = `${userName} (${userRole === 'admin' ? 'คุณครู' : 'นักเรียน'})`;

            if (userRole === 'student') {
                document.getElementById('admin-studio-btn').style.display = 'none';
            }

            populateLessonDropdown();
            startEspHardwareListener();
        });

        function populateLessonDropdown() {
            const selectEl = document.getElementById('player-lesson-select');
            let savedKeys = Object.keys(localStorage).filter(k => k.startsWith('warp_lesson_'));
            let html = `<option value="">-- เลือกบทเรียน --</option>`;

            savedKeys.forEach(key => {
                let name = key.replace('warp_lesson_', '');
                html += `<option value="${name}">${name}</option>`;
            });

            selectEl.innerHTML = html;

            let activeData = localStorage.getItem('active_lesson_data');
            if (activeData) {
                let parsed = JSON.parse(activeData);
                let pName = parsed.metadata?.projectName;
                if (pName) {
                    selectEl.value = pName;
                    loadLessonForPlayer(pName);
                }
            }
        }

        async function loadLessonForPlayer(lessonName) {
            if (!lessonName) return;

            let storedJson = localStorage.getItem(`warp_lesson_${lessonName}`);
            if (storedJson) {
                lessonData = JSON.parse(storedJson);
                triggeredEvents.clear();

                let blob = await getVideoFromStorage(lessonName);
                if (blob) {
                    playerVideo.src = URL.createObjectURL(blob);
                } else {
                    alert('ไม่พบไฟล์วิดีโอในคลัง กรุณาอัปโหลดในหน้า Studio ก่อนครับ');
                }
            }
        }

        playerVideo.addEventListener('timeupdate', () => {
            if (!lessonData || !lessonData.events) return;
            const currTime = playerVideo.currentTime;

            lessonData.events.forEach((evt) => {
                if (!triggeredEvents.has(evt.id) && currTime >= evt.startSec) {
                    triggeredEvents.add(evt.id);
                    triggerInteractiveQuestion(evt);
                }
            });
        });

        function triggerInteractiveQuestion(evt) {
            currentEvent = evt;
            playerVideo.pause();

            document.getElementById('displayQuestion').innerText = evt.question || "โปรดตอบคำถามโดยกดปุ่มสีที่กล่องฮาร์ดแวร์";
            document.getElementById('txtRed').innerText = evt.options?.red || "ข้อ ก.";
            document.getElementById('txtYellow').innerText = evt.options?.yellow || "ข้อ ข.";
            document.getElementById('txtGreen').innerText = evt.options?.green || "ข้อ ค.";
            document.getElementById('txtBlue').innerText = evt.options?.blue || "ข้อ ง.";

            feedbackBanner.style.display = 'none';
            questionOverlay.style.display = 'flex';
        }

        function startEspHardwareListener() {
            espPollingInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/logs/latest-btn-trigger`);
                    if (res.ok) {
                        const data = await res.json();
                        document.getElementById('espStatusTag').className = "badge badge-success";
                        document.getElementById('espStatusTag').innerHTML = '<i class="fa-solid fa-wifi"></i> พร้อมใช้งาน';

                        if (data && data.buttonColor && questionOverlay.style.display === 'flex') {
                            processHardwareAnswer(data.buttonColor.toLowerCase());
                        }
                    }
                } catch (e) {
                    document.getElementById('espStatusTag').className = "badge badge-warning";
                    document.getElementById('espStatusTag').innerText = "รอสัญญาณ ESP32...";
                }
            }, 300);
        }

        function processHardwareAnswer(pressedColor) {
            if (!currentEvent) return;

            const isCorrect = (pressedColor === currentEvent.correctColor);
            sendStudentLogToBackend(currentEvent.name, pressedColor, isCorrect);

            feedbackBanner.style.display = 'inline-block';
            if (isCorrect) {
                feedbackBanner.style.background = '#d1fae5';
                feedbackBanner.style.color = '#065f46';
                feedbackBanner.innerHTML = '✨ เก่งมาก! ตอบถูกต้อง 🎉';
            } else {
                feedbackBanner.style.background = '#fee2e2';
                feedbackBanner.style.color = '#991b1b';
                feedbackBanner.innerHTML = `❌ ยังไม่ถูกต้อง (เฉลยที่ถูกคือ: สี${getColorNameThai(currentEvent.correctColor)})`;
            }

            setTimeout(() => {
                questionOverlay.style.display = 'none';
                currentEvent = null;
                playerVideo.play();
            }, 2200);
        }

        function getColorNameThai(color) {
            switch(color) {
                case 'red': return 'แดง';
                case 'yellow': return 'เหลือง';
                case 'green': return 'เขียว';
                case 'blue': return 'น้ำเงิน';
                default: return color;
            }
        }

        async function sendStudentLogToBackend(eventName, chosenColor, isCorrect) {
            try {
                const studentName = localStorage.getItem('warp_user_name') || 'Student';
                await fetch(`${API_BASE_URL}/api/logs/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        studentName: studentName,
                        eventName: eventName,
                        selectedColor: chosenColor,
                        isCorrect: isCorrect,
                        timestamp: new Date().toISOString()
                    })
                });
            } catch (e) { console.error("ไม่สามารถบันทึก Log ได้:", e); }
        }

        window.addEventListener('keydown', (e) => {
            if (questionOverlay.style.display === 'flex') {
                const key = e.key.toLowerCase();
                if (key === 'r') processHardwareAnswer('red');
                if (key === 'y') processHardwareAnswer('yellow');
                if (key === 'g') processHardwareAnswer('green');
                if (key === 'b') processHardwareAnswer('blue');
            }
        });
    </script>
</body>
</html>
